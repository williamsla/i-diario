<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <title>Radar Educacional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
  <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>

  <?!= include('styleLogin') ?>

  <style>
    :root {
      --green-dark:   #163d28;
      --green-mid:    #256b3f;
      --green-main:   #3ab54a;
      --green-glow:   rgba(58,181,74,0.18);
      --orange:       #f5a623;
      --red:          #e8302a;
      --white:        #ffffff;
      --muted:        #6fa882;
      --input-bg:     #1b4d2e;
      --input-border: #2a6b3d;
      --card-bg:      rgba(20, 54, 35, 0.82);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: var(--green-dark);
      background-image:
        radial-gradient(ellipse 90% 70% at 80% 115%, rgba(45,107,63,0.5) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 0% 0%,  rgba(245,166,35,0.07) 0%, transparent 55%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    .dot-grid {
      position: fixed; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 0; pointer-events: none;
    }

    .radar-bg {
      position: fixed; right: -140px; bottom: -140px;
      width: 700px; height: 700px;
      pointer-events: none; z-index: 0;
    }
    .radar-ring {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(58,181,74,0.13);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      animation: pulse-ring 5s ease-out infinite;
    }
    .radar-ring:nth-child(1){ width:160px; height:160px; animation-delay:0s; }
    .radar-ring:nth-child(2){ width:320px; height:320px; animation-delay:1s; }
    .radar-ring:nth-child(3){ width:490px; height:490px; animation-delay:2s; }
    .radar-ring:nth-child(4){ width:680px; height:680px; animation-delay:3s; }
    @keyframes pulse-ring {
      0%  { opacity:.65; transform:translate(-50%,-50%) scale(.95); }
      70% { opacity:.1;  transform:translate(-50%,-50%) scale(1.04); }
      100%{ opacity:0;   transform:translate(-50%,-50%) scale(1.06); }
    }
    .radar-sweep {
      position: absolute; width:50%; height:2px;
      top:50%; left:50%; transform-origin:left center;
      background: linear-gradient(to right, var(--green-main), transparent);
      animation: sweep 6s linear infinite; opacity:.28;
    }
    @keyframes sweep { to{ transform:rotate(360deg); } }

    /* Educa — bottom-left */
    .powered-by {
      position: fixed; bottom: 24px; left: 28px;
      display: flex; align-items: center; gap: 10px;
      z-index: 20; text-decoration: none;
      opacity: 0;
      animation: fade-up 0.6s 0.9s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    @keyframes fade-up {
      from{ opacity:0; transform:translateY(8px); }
      to  { opacity:1; transform:translateY(0); }
    }
    .powered-by .pb-label {
      font-size: 10px; letter-spacing: .14em;
      text-transform: uppercase; color: rgba(255,255,255,0.28);
      transition: color .2s;
    }
    .powered-by img {
      height: 32px; width: auto; object-fit: contain;
      filter: brightness(0) invert(1);
      opacity: .38; transition: opacity .2s;
    }
    .powered-by:hover img   { opacity: .7; }
    .powered-by:hover .pb-label { color: rgba(255,255,255,.55); }

    /* card */
    .login-card {
      position: relative; z-index: 10;
      width: 450px; max-width: 95vw;
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px; padding: 0;
      backdrop-filter: blur(22px);
      box-shadow:
        0 2px 0 rgba(255,255,255,0.06) inset,
        0 40px 100px rgba(0,0,0,0.5),
        0 0 0 1px rgba(37,107,63,0.3);
      overflow: hidden;
      animation: card-in 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes card-in {
      from{ opacity:0; transform:translateY(28px) scale(.98); }
      to  { opacity:1; transform:translateY(0) scale(1); }
    }

    .card-stripe {
      height: 4px;
      background: linear-gradient(to right, var(--red) 0%, var(--orange) 45%, var(--green-main) 100%);
    }

    .card-body { padding: 44px 44px 40px; }

    /* product logo */
    .product-logo {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 32px;
      animation: card-in 0.7s 0.1s cubic-bezier(0.22,1,0.36,1) both;
    }
    .radar-icon { flex-shrink: 0; width: 58px; height: 58px; }

    .product-name-wrap { display:flex; flex-direction:column; line-height:1; }
    .product-label {
      font-size: 10.5px; letter-spacing: .16em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 5px;
    }
    .product-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 23px;
      color: var(--white); letter-spacing: -.3px; line-height: 1;
    }
    .product-name em { font-style: normal; color: var(--green-main); }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.09), transparent);
      margin-bottom: 28px;
      animation: card-in 0.6s 0.18s both;
    }

    .login-heading {
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 22px;
      color: var(--white); margin-bottom: 5px;
      animation: card-in 0.6s 0.15s both;
    }
    .login-sub {
      font-size: 13.5px; color: var(--muted);
      margin-bottom: 26px;
      animation: card-in 0.6s 0.2s both;
    }

    .field-group { margin-bottom: 18px; }
    .field-group:nth-child(1){ animation: card-in 0.6s 0.25s both; }
    .field-group:nth-child(2){ animation: card-in 0.6s 0.3s both; }

    label {
      display: block; font-size: 11px; font-weight: 500;
      letter-spacing: .09em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 7px;
    }
    .input-wrap { position: relative; }
    .input-wrap svg {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }
    input[type="text"], input[type="password"] {
      width: 100%; background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 11px; color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; padding: 13px 14px 13px 40px;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: var(--green-main);
      box-shadow: 0 0 0 3px var(--green-glow);
    }
    input::placeholder { color: #2e6040; }

    .btn-login {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      width: 100%; margin-top: 26px; padding: 14px;
      background: linear-gradient(135deg, #42c454 0%, #279138 100%);
      border: none; border-radius: 11px; color: #fff;
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 15px; letter-spacing: .05em;
      cursor: pointer; position: relative; overflow: hidden;
      transition: transform .15s, box-shadow .2s;
      box-shadow: 0 4px 28px rgba(58,181,74,.4);
      animation: card-in 0.6s 0.35s both;
    }
    .btn-login::after {
      content:''; position:absolute; inset:0;
      background: linear-gradient(135deg, rgba(255,255,255,.12), transparent);
    }
    .btn-login:hover  { transform:translateY(-1px); box-shadow:0 8px 36px rgba(58,181,74,.55); }
    .btn-login:active { transform:translateY(0); }

    #message {
      margin-top: 14px; font-size: 13px;
      text-align: center; min-height: 18px;
      animation: card-in 0.6s 0.4s both;
    }

    body.loading::after {
      content:''; position:fixed; inset:0;
      background:rgba(15,40,22,.65); backdrop-filter:blur(4px); z-index:999;
    }
    body.loading::before {
      content:''; position:fixed; top:50%; left:50%;
      width:40px; height:40px;
      border:3px solid rgba(255,255,255,.12);
      border-top-color: var(--green-main); border-radius:50%;
      transform:translate(-50%,-50%);
      animation:spin .7s linear infinite; z-index:1000;
    }
    @keyframes spin { to{ transform:translate(-50%,-50%) rotate(360deg); } }

    .ui-dialog{ border-radius:14px !important; border:1px solid rgba(255,255,255,.1) !important; background:#1b4d2e !important; color:#c0ddc8 !important; }
    .ui-dialog-titlebar{ background:#163d28 !important; border-radius:14px 14px 0 0 !important; color:#fff !important; font-family:'Syne',sans-serif !important; }
    .ui-dialog-buttonpane{ background:#163d28 !important; border-radius:0 0 14px 14px !important; }
    .ui-button{ background:var(--green-mid) !important; color:#fff !important; border:none !important; border-radius:8px !important; font-family:'DM Sans',sans-serif !important; }
    .ui-button:hover{ background:var(--green-main) !important; }
    .hidden{ display:none; }
  </style>
</head>
<body>

  <div class="dot-grid"></div>

  <div class="radar-bg">
    <div class="radar-ring"></div>
    <div class="radar-ring"></div>
    <div class="radar-ring"></div>
    <div class="radar-ring"></div>
    <div class="radar-sweep"></div>
  </div>

  <!-- Educa — bottom-left "powered by" -->
  <a class="powered-by" href="https://ensino.site" target="_blank" rel="noopener" title="Educa">
    <span class="pb-label">powered by</span>
    <img src="https://ensino.site/wp-content/uploads/2025/07/cropped-cropped-logo-com-nome-ftransparente-120x145.png" alt="Educa" />
  </a>

  <div class="login-card">
    <div class="card-stripe"></div>
    <div class="card-body">

      <!-- Custom SVG product logo -->
      <div class="product-logo">
        <div class="radar-icon">
          <svg viewBox="0 0 58 58" fill="none" xmlns="http://www.w3.org/2000/svg" width="58" height="58">
            <circle cx="29" cy="29" r="27" stroke="#3ab54a" stroke-width="1.4" opacity=".45"/>
            <circle cx="29" cy="29" r="18" stroke="#3ab54a" stroke-width="1" stroke-dasharray="4 3" opacity=".35"/>
            <circle cx="29" cy="29" r="9"  stroke="#3ab54a" stroke-width="1.4" opacity=".65"/>
            <circle cx="29" cy="29" r="2.5" fill="#3ab54a"/>
            <path d="M29 29 L50.5 12 A27 27 0 0 1 56 29 Z" fill="url(#sg)" opacity=".18"/>
            <line x1="29" y1="29" x2="51.5" y2="11.5" stroke="#3ab54a" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
            <!-- orange blip -->
            <circle cx="44" cy="18" r="2.6" fill="#f5a623" opacity=".9">
              <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.4s" repeatCount="indefinite"/>
            </circle>
            <!-- green blip -->
            <circle cx="36" cy="39" r="1.8" fill="#3ab54a" opacity=".85">
              <animate attributeName="opacity" values="0.85;0.1;0.85" dur="3.2s" begin="0.9s" repeatCount="indefinite"/>
            </circle>
            <!-- crosshair -->
            <line x1="29" y1="2"  x2="29" y2="9"  stroke="#3ab54a" stroke-width=".9" opacity=".3"/>
            <line x1="29" y1="49" x2="29" y2="56" stroke="#3ab54a" stroke-width=".9" opacity=".3"/>
            <line x1="2"  y1="29" x2="9"  y2="29" stroke="#3ab54a" stroke-width=".9" opacity=".3"/>
            <line x1="49" y1="29" x2="56" y2="29" stroke="#3ab54a" stroke-width=".9" opacity=".3"/>
            <defs>
              <linearGradient id="sg" x1="29" y1="29" x2="56" y2="29">
                <stop offset="0%" stop-color="#3ab54a"/>
                <stop offset="100%" stop-color="transparent"/>
              </linearGradient>
            </defs>
          </svg>
        </div>

        <div class="product-name-wrap">
          <span class="product-label">Sistema de avaliação</span>
          <span class="product-name">Radar <em>Educacional</em></span>
        </div>
      </div>

      <div class="divider"></div>

      <p class="login-heading">Acesso à plataforma</p>
      <p class="login-sub">Insira os dados da sua escola para continuar</p>

      <form method="post" action="">
        <div class="field-group">
          <label for="inep_escola">INEP da Escola</label>
          <div class="input-wrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/>
            </svg>
            <input id="inep_escola" name="inep_escola" required type="text" maxlength="8" placeholder="12345678" autocomplete="off"/>
          </div>
        </div>

        <div class="field-group">
          <label for="senha">Senha</label>
          <div class="input-wrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input id="senha" name="senha" required type="password" placeholder="••••••••"/>
          </div>
        </div>

        <button type="submit" class="btn-login">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Entrar
        </button>
      </form>

      <p id="message"></p>
    </div>
  </div>

  <div id="modal" class="modal"></div>
  <div id="dialog-confirm" class="hidden" title="">
    <p>
      <span class="ui-icon ui-icon-alert" style="float:left; margin:12px 12px 20px 0;"></span>
      O que você deseja acessar?
    </p>
  </div>

  <script>
    document.querySelector('form').addEventListener('submit', handleSubmit);

    function handleSubmit(event) {
      event.preventDefault();
      showHideLoading();
      let inep_escola = document.getElementById('inep_escola').value;
      let senha       = document.getElementById('senha').value;

      google.script.run.withSuccessHandler(response => {
        showMessage(response.status, response.message);
        if (response.status == true) {
          showHideLoading();
          $("#dialog-confirm").dialog({
            title: "O que deseja acessar?",
            resizable: false,
            height: "auto",
            width: 400,
            modal: true,
            buttons: {
              "Registrar gabarito do aluno": function() { callToPage("pageFormGabarito", inep_escola); },
              "Ver resultados":              function() { callToPage("pageResultComparativo2", inep_escola); }
            }
          });
          $("#dialog-confirm").removeClass('hidden');
        }
        showHideLoading();
      }).withFailureHandler(error => {
        console.error("ERROR: " + error.message);
        showHideLoading();
      }).login(inep_escola, senha);
    }

    function callToPage(page, inep) {
      google.script.run.withSuccessHandler(url => {
        window.top.location.href = url + "?page=" + page + ".html&inep=" + inep;
      }).withFailureHandler(error => {
        console.error("ERROR: " + error.message);
      }).getScriptUrl();
    }

    function showMessage(status, message) {
      document.getElementById('message').innerHTML = message;
      document.getElementById('message').style.color = status == true ? '#3ab54a' : '#e8302a';
    }

    function showHideLoading(divId = null) {
      if (divId == null) { $('body').toggleClass('loading'); }
      else               { $('#' + divId).toggleClass('loading'); }
    }
  </script>

</body>
</html>
