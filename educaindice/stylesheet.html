<style>
  * {
    box-sizing: border-box;
  }

  *, *:before, *:after { 
  margin:0;
  padding:0;
  font-family: Arial,sans-serif;
}

  html {
  height: 100%;
}

  body {
    /* font-size: calc(.5em + 3vw); */
    font-size: calc(.2em + 1vw);
  }

  .alternativa-desc {
    font-size: small;
    font-weight: normal;
  }

  .modal {
          display:    none;
          position:   fixed;
          z-index:    1000;
          top:        0;
          left:       0;
          height:     100%;
          width:      100%;
          background: rgba( 255, 255, 255, .8 )
          url('https://i.stack.imgur.com/FhHRx.gif')
          50% 50%
          no-repeat;
      }
      body.loading {
          overflow: hidden;
      }
      body.loading .modal {
          display: block;
      }

  .group-images {
    display:inline;
    height: 70px;
    margin: 5px;
  }

  select option:disabled {
    content: '/f00c';
    font-family: "Font Awesome 5 Free";
    font-weight: 900;
  }

  .box{
  display:flex;
  justify-content:center;
}

.box-itens{
   flex:1;
   display: flex;
   justify-content: center;
   transform: translateX(10px);/*D element Width[if needed]*/
}

  .wrong {
    background-color: #FAA0A0	;
  }

  .ok {
    background-color: lightcyan;
  }

  #result {
    padding: 10px;
    margin-top: 30px;
    color: black;
    /* font-size: 14px; */
  }

  .hidden {
    display: none;
  }

  ul {
    float: left;
    list-style-type: none;
  }

li {
  display: inline-block;
  list-style: none;
  padding-right: 10px;
}

  input[type=text], select, textarea {
    width: 100%;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
    resize: vertical;
  }

  label {
    padding-right: 20px;
  }

  .label-inputs {
    padding: 12px 12px 12px 0;
    display: inline-block;
  }

  .label-gabarito {
    float: left;
    padding: 0 1em;
    text-align: center;
  }

  input[type=submit] {
    background-color: #04AA6D;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    float: right;
  }

  input[type=submit]:hover {
    background-color: #45a049;
  }

  .container {
    height: 100%;
    width: 100%;
    font-size: 18px;
  }

  .col-25 {
    float: left;
    width: 25%;
    margin-top: 6px;
  }

  .col-75 {
    float: left;
    width: 75%;
    margin-top: 6px;
  }

  /* Clear floats after the columns */
  .row:after {
    content: "";
    display: table;
    clear: both;
  }

  table {
    width: 100%;
  }

  th {
    height: 30px;
  }

  input[type="radio"]{
    margin: 0 10px 0 10px;
  }

  /* Responsive layout - when the screen is less than 600px wide, make the two columns stack on top of each other instead of next to each other */
  @media (max-width: 739px) {
    .col-25, .col-75, input[type=submit] {
      width: 100%;
      margin-top: 0;
    }
  }
</style>
