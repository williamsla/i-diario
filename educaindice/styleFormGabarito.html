<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    html, body {
      height: 100%;
      font-size: clamp(14px, 1vw + 0.2em, 18px);
      background-color: #f5f5f5;
    }

    .container {
      max-width: 800px;
      margin: 1.5em auto;
      padding: 1.5em;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 0.5em;
      margin-bottom: 1.5em;
    }

    label {
      font-weight: bold;
    }

    #disciplina,
    #turma,
    #aluno {
      min-width: 200px;
    }

    input[type=text],
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type=text]:focus,
    select:focus,
    textarea:focus {
      border-color: #04aa6d;
      box-shadow: 0 0 5px rgba(4, 170, 109, 0.3);
      outline: none;
    }

    input[type=submit] {
      background-color: #04aa6d;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.1em;
      transition: background-color 0.3s, transform 0.2s;
      width: 100%;
    }

    input[type=submit]:hover {
      background-color: #45a049;
    }

    input[type=submit]:active {
      transform: scale(0.97);
    }

    /* Aumentar tamanho e espaçamento dos radio buttons */
    input[type="radio"] {
      width: 25px;
      height: 25px;
      margin: 0 10px;
      vertical-align: middle;
      accent-color: #007bff; /* Azul mais visível (navegadores modernos) */
    }

    /* Adiciona espaço entre grupo de alternativas */
    .radio-group {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 15px 0;
    }


    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: rgba(255, 255, 255, 0.8)
        url('https://i.stack.imgur.com/FhHRx.gif') 50% 50% no-repeat;
    }

    body.loading {
      overflow: hidden;
    }

    body.loading .modal {
      display: block;
    }

    .hidden {
      display: none;
    }

    hr {
      border: none;
      border-top: 2px solid #007bff;
      margin: 60px 0;
    }


    .ok {
      background-color: #d1f7e7;
    }

    .wrong {
      background-color: #fbdede;
    }

    #result {
      margin-top: 2em;
      padding: 1em;
      background: #f0f0f0;
      border-radius: 6px;
      color: #333;
    }

    ul {
      list-style-type: none;
      padding-left: 0;
    }

    li {
      display: inline-block;
      padding-right: 10px;
    }

    /* Seção de filtros: card + grid responsivo */
    .filtros-gabarito {
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    .filtros-gabarito-titulo {
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 0 0 1rem 0;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #e2e8f0;
    }

    #form-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem 1.5rem;
      margin: 0;
    }

    #form-inputs > li.filtro-item {
      display: flex;
      flex-direction: column;
      padding-right: 0;
      min-width: 0;
    }

    #form-inputs > li.filtro-item label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 0.35rem;
    }

    #form-inputs > li.filtro-item select {
      min-height: 42px;
    }

    #form-inputs > li.filtro-hr {
      grid-column: 1 / -1;
      padding: 0;
      margin: 0.25rem 0 0;
      display: block;
    }

    #form-inputs > li.filtro-hr hr {
      margin: 1rem 0 0.5rem;
    }

    #form-inputs > li:not(.filtro-item):not(.filtro-hr) {
      grid-column: 1 / -1;
      display: block;
      padding-right: 0;
    }

    @media (max-width: 600px) {
      #form-inputs {
        grid-template-columns: 1fr;
      }
    }

    /* Seletor de escola (acima dos filtros) */
    .escola-select-wrapper {
      margin: 0.75rem 0 0;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }

    .escola-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 0.35rem;
    }

    .escola-select {
      width: 100%;
      min-height: 42px;
    }

    .alternativa-desc {
      font-size: 0.9em;
      font-weight: normal;
    }

    .group-images {
      display: inline-block;
      height: 70px;
      margin: 5px;
    }

    .box {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .box-itens {
      flex: 1 1 100px;
      display: flex;
      justify-content: center;
    }

    .conceitual-nivel-linha {
      display: flex;
      margin-bottom: 10px;
      align-items: flex-start;
    }

    .conceitual-nivel-linha-enunciado {
      flex: 1;
      padding-right: 10px;
      text-align: left;
    }

    .conceitual-nivel-linha-alternativas {
      flex: 2;
      display: flex;
      gap: 15px; /* Espaço entre os grupos */
      flex-wrap: wrap; /* Quebra de linha, se necessário */
    }

    .alternativa-horizontal {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    input[type="radio"]:disabled {
      filter: grayscale(100%);
      opacity: 0.6;
      cursor: not-allowed;
      accent-color: gray; /* para navegadores que suportam */
    }

    /* Opcional: aplicar também ao label, se houver */
    input[type="radio"]:disabled + label {
      color: #888;
      font-weight: bold;
    }



    @media (min-width: 768px) {
      .form-grid {
        flex-direction: row;
        align-items: center;
      }

      .form-grid label {
        width: 25%;
      }

      .form-grid input,
      .form-grid select,
      .form-grid textarea {
        width: 75%;
      }
    }

</style>
