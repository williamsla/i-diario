    <script>
      function showHideLoading(){
        $('body').toggleClass('loading');
      }

      function showInputsComplement(){
        document.querySelectorAll('#form-inputs .complement').forEach(function(node) {
          node.classList.remove('hidden');
        });
      }

      function hideInputsComplement(){
        document.querySelectorAll('#form-inputs .complement').forEach(function(node) {
          node.classList.add('hidden');
        });
      }

      function createEmptyOption(){
        let opt = document.createElement('option');
        opt.value = "-1";
        opt.innerHTML = "-- Selecione uma opção --";
        
        return opt;
      }

      function removeAllChildNodes(parent) {
          while (parent.firstChild) {
              parent.removeChild(parent.firstChild);
          }
      }

      function removeWhiteSpaces(text) {
        return text.replace(/\s/g, "");
      }

      function init() {
         var inep = "<?=inep?>"; 

        loadCabecalho();
        loadAvaliacoes();

        if (inep == 'semed'){
          carregarEscolas();
        } else {
          loadEscola(inep);
        }
      }
      init();

      function domEscolaNome(){
        var escola_el = document.getElementById('escola');
        return escola_el.options[escola_el.selectedIndex].text;
      }

      function domEscolaINEP(){
        return document.getElementById('escola').value;
      }

      function carregarEscolas() {
        showHideLoading();

        removeAllChildNodes(document.getElementById('escola'));
        
        google.script.run.withSuccessHandler(response => {
          let escolas = response.message;

          if (escolas.length > 1) {
            document.getElementById('escola').appendChild(createEmptyOption());
          }

          // preenchendo as opções de escolas
          for (var i = 0; i < escolas.length; i++) {
            let escola = escolas[i];
            let opt = document.createElement('option');
            opt.value = escola.inep;
            opt.innerHTML = escola.nome;
      
            document.getElementById('escola').appendChild(opt);
          }
          showHideLoading();
        }).withFailureHandler(error => {
            console.error("Init ERROR: " + error.message);
            console.error(error);
            showHideLoading();
        }).getEscolasTodas();
      }

      document.getElementById('escola').addEventListener('change', () => {
                  let inepEscola = document.getElementById('escola').value;
                  loadEscola(inepEscola);
                  clearInputsFiltro();
                  clearInputsGabarito();
                });

      document.getElementById('avaliacao').addEventListener('change', () => {
                  hideResult();
                  loadAlunos();
                  loadDisciplinas();
                });

      document.getElementById('serie').addEventListener('change', () => {
                  hideResult(); 
                  loadTurmas();
                  loadDisciplinas();
                  loadAlunos();
                });
      document.getElementById('turma').addEventListener('change', () => { 
                  loadAlunos();
                  hideResult();
                });
      document.getElementById('disciplina').addEventListener('change', () => { 
                  loadQuestoes();
                  loadAlunos();
                });
      document.getElementById('aluno').addEventListener('change', () => { 
                  loadGabarito();
                  hideResult();
                });
      
      document.querySelector('form').addEventListener('submit', handleSubmit);
      
      function loadCabecalho() {
        showHideLoading();
        
        google.script.run.withSuccessHandler(response => {
              document.querySelector('#title').innerHTML = response[0];
              document.querySelector('#logo-prefeitura').src = response[1];
              document.querySelector('#logo-semed').src = response[2];
            
              
              showHideLoading();
          }).withFailureHandler(error => {
              console.error("load Series ERROR: " + error.message);
              console.error(error);
              
              showHideLoading();
          }).getCabecalho();
      }

       function loadAvaliacoes() {
        google.script.run.withSuccessHandler(response => {
            for (var i = 0; i < response.length; i++) {
              let ava = response[i];
              let opt = document.createElement('option');
              opt.value = ava.id;
              opt.innerHTML = ava.nome;

              if ((i +1) == response.length) {
                opt.selected="selected";
              }
        
              document.getElementById('avaliacao').appendChild(opt);
            }
              
          }).withFailureHandler(error => {
              console.error("load AVALIAÇÕES ERROR: " + error.message);
              console.error(error);
              
          }).getAvaliacoes("gabarito");
      }

      function loadEscola(inep) {
        google.script.run.withSuccessHandler(response => {
              document.getElementById('inep').value = inep;

              let opt = document.createElement('option');
              opt.value = inep;
              opt.innerHTML = response[0];
              // opt.selected = true;
              opt.setAttribute('selected', 'selected');

        
              document.getElementById('escola').appendChild(opt);

              loadSeries();
              
          }).withFailureHandler(error => {
              console.error("load ESCOLA ERROR: " + error.message);
              console.error(error);
              
          }).getEscola(inep);
      }


      function loadSeries() {
        showHideLoading();

        document.getElementById('serie').innerHTML = "";
        
        document.getElementById('serie').appendChild(createEmptyOption());
        
        var escola = domEscolaINEP();
        
          google.script.run.withSuccessHandler(response => {
            for (var i = 0; i < response.length; i++) {
              let s = response[i];
              let opt = document.createElement('option');
              opt.value = s;
              opt.innerHTML = s;
        
              document.getElementById('serie').appendChild(opt);
            }
            
              showHideLoading();
          }).withFailureHandler(error => {
              console.error("load Series ERROR: " + error.message);
              console.error(error);
              
              showHideLoading();
          }).getSeriesPorEscolaINEP(escola);
      }

      function loadTurmas() {
        showHideLoading();

        document.getElementById('turma').innerHTML = "";
        const escola_nome = domEscolaNome();

        var serie = document.getElementById('serie').value; 
        document.getElementById('turma').appendChild(createEmptyOption());

       
            google.script.run.withSuccessHandler(response => {
              for (var i = 0; i < response.length; i++) {
                let turmaNome = response[i];
                let opt = document.createElement('option');
                opt.value = turmaNome;
                opt.innerHTML = turmaNome;
          
                document.getElementById('turma').appendChild(opt);
              }
              
              showHideLoading();
          }).withFailureHandler(error => {
              console.error("load Turmas ERROR: " + error.message);
              console.error(error);
              
              showHideLoading();
          }).getTurmas(escola_nome, serie);
      }

      function loadDisciplinas() {
        showHideLoading();

        document.getElementById('disciplina').innerHTML = "";
        var avaliacao = document.getElementById('avaliacao').value;
        var serie = document.getElementById('serie').value;

        document.getElementById('disciplina').appendChild(createEmptyOption());
       
            google.script.run.withSuccessHandler(response => {
              for (var i = 0; i < response.length; i++) {
                let opt = document.createElement('option');
                opt.value = response[i];
                opt.innerHTML = response[i];
          
                document.getElementById('disciplina').appendChild(opt);
              }

              console.error("load Disciplinas ERROR: " + error.message);

      }

      function loadQuestoes() {
        showHideLoading();

        document.getElementById('aluno').innerHTML = "";
        var avaliacao = document.getElementById('avaliacao').value;
        var serie = document.getElementById('serie').value; 
        var turma = document.getElementById('turma').value; 
        var disciplina = document.getElementById('disciplina').value;
        
        document.getElementById('aluno').appendChild(createEmptyOption());
       
        google.script.run.withSuccessHandler(response => {
            document.getElementById('questoes').dataset.questoes = JSON.stringify(response);
              
            showHideLoading();
        }).withFailureHandler(error => {
            console.error("load Alunos ERROR: " + error.message);
            console.error(error);
            
            showHideLoading();
        }).getQuestoes(avaliacao, serie, disciplina);

      }

      function loadAlunos() {
        showHideLoading();

        document.getElementById('aluno').innerHTML = "";
        var avaliacao = document.getElementById('avaliacao').value;
        var escola = domEscolaNome();
        var serie = document.getElementById('serie').value; 
        var turma = document.getElementById('turma').value; 
        var disciplina = document.getElementById('disciplina').value; 

        document.getElementById('aluno').appendChild(createEmptyOption());
       
        google.script.run.withSuccessHandler(response => {
            
            for (var i = 0; i < response.length; i++) {
              let alunoNomeID = response[i].split('|');
              let opt = document.createElement('option');
                            
              opt.value = alunoNomeID[1];
              opt.innerHTML = alunoNomeID[2] == 1 ? alunoNomeID[0] + " (FEITO)" : alunoNomeID[0];
              // opt.disabled = alunoNomeID[2] == 1;
              opt.style.color = alunoNomeID[2] == 1 ? 'blue' : 'black';
        
              document.getElementById('aluno').appendChild(opt);
            }
            
            showHideLoading();
        }).withFailureHandler(error => {
            console.error("load Alunos ERROR: " + error.message);
            console.error(error);
            
            showHideLoading();
        }).getAlunos(avaliacao, escola, serie, turma, disciplina);
      }

      function loadQuestaoObjetiva(indexQuestao, questao) {
            let elementQuestao =`<td class="text-center">${questao.questao} ${questao.enunciado}</td>
              <td align="center">
                <div id="questao-${indexQuestao}" data-subquestoes="0" class="resposta radio-group">`;
                  
                  for (var j=0; j < questao.alternativas.length; j++) {
                    let alternativa = questao.alternativas[j];

                    elementQuestao += `<label for="${alternativa.alternativa}-${indexQuestao}">
                                        <input id="${alternativa.alternativa}-${indexQuestao}" type="radio" name="resposta-${indexQuestao}-1" value="${alternativa.alternativa}"/><br/><span class="alternativa-letra">${alternativa.alternativa}</span><br><span class="alternativa-desc">${alternativa.descricao}</span>
                                </label>`;
                  }

            elementQuestao += `</div>
              </td>`;
        
        return elementQuestao;
      }

      function loadQuestaoConceitualNivel(indexQuestao, questao) {
        let subquestoesSet = new Set();
        for (let alt of questao.alternativas) {
          subquestoesSet.add(alt.subquestao);
        }
        let listaSubquestoes = Array.from(subquestoesSet).sort();

        let linhasHTML = `
          <td class="text-center" style="vertical-align: top;">
            ${questao.questao}<br><br><br>              
          </td>`;

        // Coluna 2: Campo conceitual + subquestões
        linhasHTML += `<td class="text-center" style="vertical-align: top;">`;

        // Linha do campo conceitual
        linhasHTML += `
          <div class="conceitual-nivel-linha">
            <div class="conceitual-nivel-linha-enunciado">
              <span></span>
            </div>
            <div class="conceitual-nivel-linha-alternativas">
               <select id="head-conceitual-nivel-${indexQuestao}" class="select-head" onchange="configurarConceitualSelect(${indexQuestao}, this.value)">
                <option value="0">A</option>
                <option value="-1">B</option>
                <option value="-2">C</option>
                <option value="-3">D</option>
                <option value="-4">E</option>
                <option value="-5">F</option>
                <option value="-6">G</option>
                <option value="-7">H</option>
              </select>
            </div>
          </div>`;

        // Linhas para cada subquestão
        for (let sub of listaSubquestoes) {

          linhasHTML += `
            <div class="conceitual-nivel-linha-${indexQuestao}">
              <div class="conceitual-nivel-linha-enunciado">
                <span>${questao.enunciado[sub - 1]}</span>
              </div>
              <div id="questao-${indexQuestao}-${sub}" data-subquestoes="${listaSubquestoes.length}" class="resposta radio-group conceitual-nivel-linha-alternativas">`;
  
          let alternativas = questao.alternativas.filter(alt => alt.subquestao === sub);

          for (let alt of alternativas) {
            linhasHTML += `
              <label for="${alt.alternativa}-${indexQuestao}-${sub}">
                <input id="${alt.alternativa}-${indexQuestao}-${sub}" type="radio" name="resposta-${indexQuestao}-${sub}" class="questao-${indexQuestao}" value="${alt.alternativa}"/><br/>
                <span class="alternativa-letra">${alt.alternativa}</span><br/>
                <span class="alternativa-desc">${alt.descricao}</span>
              </label><br/>`;
          }

          linhasHTML += `
              </div>
            </div>`;
        }

        linhasHTML += `</td>`;

        return linhasHTML;

      }
      
      function configurarConceitualSelect(indexQuestao, value) {
        
        const radios = document.querySelectorAll(`input[class="questao-${indexQuestao}"]`);

        const desabilitar = value !== "0";
        radios.forEach(radio => {
          radio.checked = false;
          radio.disabled = desabilitar;
          radio.dataset.select_head = value;
        });
      }

      function loadGabarito() {
        showHideLoading();

        var tabela = document.getElementById('gabarito');
        tabela.innerHTML = "";
        var avaliacao = document.getElementById('avaliacao').value;
        var disciplina = document.getElementById('disciplina').value;
        let idAluno = document.getElementById('aluno').value;

        var questoes = JSON.parse(document.getElementById('questoes').dataset.questoes);

        var cabecalho = document.createElement('thead');
        var trCabecalho = document.createElement('tr');
        trCabecalho.innerHTML='<th scope="col">Questão</th><th scope="col">Resposta</th>';
        cabecalho.appendChild(trCabecalho);

        var corpo = document.createElement('tbody');
        var map = {};
        for (var i=0; i< questoes.length; i++) {
          var questao = questoes[i];
          let tipo = questao.tipo;
          var trCorpo = document.createElement('tr');
          map[i]= tipo;

          let elementQuestao;
          if (tipo === "conceitual-nivel") {
            elementQuestao = loadQuestaoConceitualNivel(i, questao);
          } else {
            elementQuestao = loadQuestaoObjetiva(i, questao);
          }
              
          trCorpo.innerHTML = elementQuestao;

          corpo.appendChild(trCorpo);
        }

        tabela.appendChild(cabecalho);
        tabela.appendChild(corpo);


        google.script.run.withSuccessHandler(response => {
            if (response != null && response.escreveonome) {
              let escreveonome = response.escreveonome;
              let respostas = response.respostas;
              $(`[name=escrevenome]`).filter(`[value=${escreveonome}]`).prop('checked', true);

              let aux_questao;
              let aux_questao_subquestao = 1;
              for (var i = 0; i < respostas.length; i++) {
                  let alternativa = respostas[i];
                  if (map[i] === "objetiva" || map[i] === "conceitual") {
                    aux_questao = undefined;
                    aux_questao_subquestao = 1;
                    $(`[name=resposta-${i}-1]`).filter(`[id=${alternativa}-${i}]`).prop('checked', true);

                  } else {

                    if (aux_questao === undefined) {
                      aux_questao = i;
                    }

                    $(`[name=resposta-${aux_questao}-${aux_questao_subquestao}]`).filter(`[id=${alternativa}-${aux_questao}-${aux_questao_subquestao}]`).prop('checked', true);
                    aux_questao_subquestao += 1;
                    
                  }
              }
            }
    
            showHideLoading();

        }).withFailureHandler(error => {
            console.error("load Alunos ERROR: " + error.message);
            console.error(error);
            
            showHideLoading();
        }).getRespostaAluno(avaliacao, disciplina, idAluno);
  
      }

      function handleSubmit(event) {
        event.preventDefault();
        
        showHideLoading();

        let avaliacao = document.getElementById('avaliacao').value;
        let escola = domEscolaNome();
        let aluno = document.getElementById('aluno').value;
        let serie = document.getElementById('serie').value;
        let turma = document.getElementById('turma').value;
        let disciplina = document.getElementById('disciplina').value;

        let escrevenomeInput = document.getElementsByName('escrevenome');
        let escrevenomeVal = -1;
        for(i = 0; i < escrevenomeInput.length; i++) {
            if(escrevenomeInput[i].checked) {
              escrevenomeVal = escrevenomeInput[i].value.toUpperCase();
            }            
        }

        if (avaliacao == -1) {
          showHideLoading();
          alert("Escolha uma avaliação.");
          return;
        }

        if (disciplina == -1) {
          showHideLoading();
          alert("Escolha uma disciplina.");
          return;
        }

        if (aluno == -1) {
          showHideLoading();
          alert("Selecione um aluno.");
          return;
        }

        if (escrevenomeVal == -1) {
          showHideLoading();
          alert("Responda se o aluno sabe escrever o nome.");
          return;
        }

        let divRespostas = document.getElementsByClassName('resposta');
        
        let respostas = [];
        for (var j=0; j< divRespostas.length; j++) {
          let div = divRespostas[j];

          let subquestoes = div.dataset.subquestoes;

          if (subquestoes == "0") {
            subquestoes = 1;
          }
          
          for (var sub=1; sub <= subquestoes; sub++) {
            let alternativas = document.getElementsByName(`resposta-${j}-${sub}`);
            let resp;
            for (var a = 0; a < alternativas.length; a++) {
                if (alternativas[a].checked) {
                  resp = alternativas[a].value.toUpperCase();
                }
            }

            if (resp === undefined && subquestoes > 1 && alternativas.length > 0) {

                let select_head = alternativas[0].dataset.select_head;
                if (select_head != '0') {
                  resp = select_head;
                }
            }
            
            respostas.push(resp);
          }
        }
        
        google.script.run.withSuccessHandler(response => {
          $('select[id=aluno] option:selected').html($('select[id=aluno] option:selected').text() + " (FEITO)");

          clearInputsGabarito();
          showHideLoading();          
        }).withFailureHandler(error => {
          console.error("handleSubmit ERROR: " + error.message);
          console.error(error);

          showHideLoading();
        }).submit(avaliacao, escola, turma, serie, aluno, disciplina, escrevenomeVal, respostas);
      }

      function encontrarSelectAcima(elemento) {
        let pai = elemento.closest('.conceitual-nivel-linha-12');
        if (!pai) return null;
        return pai.previousElementSibling?.tagName === 'SELECT'
          ? pai.previousElementSibling
          : pai.parentElement.querySelector('select');
      }

      function showResult(status, message) {
        showHideLoading();

        document.getElementById('result').innerHTML = '';
        document.getElementById('result').style.display = 'block';

        if (status == true) {
          clearInputsGabarito();
          document.getElementById('result').classList.add('ok');
          document.getElementById('result').classList.remove('wrong');
        } else {
          document.getElementById('result').classList.add('wrong');
          document.getElementById('result').classList.remove('ok');
        }
        let el = document.createElement('p');
        el.innerHTML = message;
        document.getElementById('result').appendChild(el);

        document.getElementById("result").scrollIntoView();
        
        showHideLoading();
      }

      function hideResult() {
        showHideLoading();

        document.getElementById('result').innerHTML = '';
        document.getElementById('result').style.display = 'none';
        
        showHideLoading();
      }

      function clearInputsFiltro() {
        showHideLoading();

        document.getElementById('disciplina').value = '-1';
        document.getElementById('turma').value = '-1';
        
        
        showHideLoading();

      function getLetra(largura_imagem, posicao_circulo_atual){
      let espaco_por_letra = largura_imagem / letras.length;
      console.log("\n\n--\n Espaço por letra:", espaco_por_letra);

      for (let i = 1; i <= letras.length; i++) {
        let x_atual = espaco_por_letra * i;
        console.log(`I: ${i}, X atual: ${x_atual}, Posição círculo: ${posicao_circulo_atual}`);
        if (posicao_circulo_atual <= x_atual) {
          return letras[i-1];
        } 
      }
      return 0;
    }

    function process(img) {
      const canvas = document.getElementById('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      let src = cv.imread(canvas);
      let largura = src.cols;   // largura da imagem

      let gray = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

      // binariza
      let thresh = new cv.Mat();
      cv.threshold(gray, thresh, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

      // contornos
      let contours = new cv.MatVector();
      let hierarchy = new cv.Mat();
      cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      // filtra círculos      
      let circles = [];
      for (let i = 0; i < contours.size(); i++) {
        let cnt = contours.get(i);
        let area = cv.contourArea(cnt);
        if (area < 50) { // || area > 20000
            continue; // pulando áreas muito pequenas ou muito grandes
        }

        let circle = cv.minEnclosingCircle(cnt);

        let expectedArea = Math.PI * circle.radius * circle.radius;
        let circularidade = area / expectedArea;

        if (circularidade > 0.6) { // se circulo bem formado
            circles.push({x: circle.center.x, y: circle.center.y, r: circle.radius, full_width: largura});
        } 
      }

      if (circles.length === 0) {
        document.getElementById('saida').textContent = "Nenhum círculo detectado.";
        return;
      }

      // agrupar por linhas (Y parecido)
      circles.sort((a,b) => a.y - b.y);
      let linhas = [];
      
      console.log('circles');
      console.log(circles);
      
      let atual = [circles[0]];
      for (let i=1; i<circles.length; i++) {
        if (Math.abs(circles[i].y - atual[0].y) < 50) {
          atual.push(circles[i]);
        } else {
          linhas.push(atual);
          atual = [circles[i]];
        }
      }
      linhas.push(atual);

      let resultados = [];
      for (let linha of linhas) {
        linha.sort((a,b) => a.x - b.x);
        let marcados = [];
        for (let j=0; j<linha.length && j<4; j++) {
          let c = linha[j];
          let mask = new cv.Mat.zeros(src.rows, src.cols, cv.CV_8UC1);
          cv.circle(mask, new cv.Point(c.x, c.y), c.r*0.6, new cv.Scalar(255), -1);
          let mean = cv.mean(gray, mask);
          mask.delete();

          // limiar mais flexível
          let isFilled = mean[0] < 180;
          let color = new cv.Scalar(255,0,0,255); // desenha no canvas (vermelho = não)
          if (isFilled) {
            color = new cv.Scalar(0,255,0,255);   // desenha no canvas (verde = marcado)

            marcados.push(getLetra(largura, c.x));
          }
          
          cv.circle(src, new cv.Point(c.x, c.y), Math.round(c.r), color, 2);
        }
        resultados.push(marcados.join(", "));
      }

      document.getElementById('saida').textContent = resultados.join("\n");
      cv.imshow(canvas, src);

      src.delete(); gray.delete(); thresh.delete(); contours.delete(); hierarchy.delete();
    }


      function mostrarRespostas(respostas) {
        const container = document.getElementById('respostas');
        container.innerHTML = '<h3>Gabarito Detectado:</h3><ul>' +

            .map(([q, r]) => `<li><strong>Questão ${q}:</strong> ${r}</li>`)
            .join('') + '</ul>';
      }
