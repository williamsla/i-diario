      objective_title: "Objetivo do PEI"
      objective_text: "Promover o desenvolvimento integral do estudante, considerando suas potencialidades e necessidades, favorecendo a ampliação das habilidades cognitivas, motoras, sociais e comunicativas, por meio de atividades lúdicas e significativas que estimulem a autonomia, a interação e a participação nas rotinas da Educação Infantil."
      final_considerations_text: "Este PEI tem como objetivo garantir ao estudante oportunidades de desenvolvimento integral, respeitando seu tempo, suas características e suas formas de aprender. As propostas pedagógicas serão organizadas de maneira lúdica e significativa, favorecendo a participação, a interação e a construção de novas aprendizagens no cotidiano da Educação Infantil. O acompanhamento contínuo, as adaptações nas atividades e a parceria com a família são fundamentais para apoiar o desenvolvimento da criança e fortalecer seu processo de aprendizagem."
      attendance_records_hint: "Os registros de atendimento do período do PEI aparecem abaixo. Clique na data para abrir o diário da sessão."
