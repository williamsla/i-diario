default: &default
  adapter: postgresql
  encoding: utf8
  pool: 5 # 1 por thread (max_threads = 5)
  timeout: 5000
  checkout_timeout: 5 # timeout esperando conexão do pool
  idle_timeout: 300 # tempo de espera para desconectar conexão do pool
  reaping_frequency: 10 # tempo de espera para limpar conexões do pool
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>

development:
  <<: *default
  database: idiario_development

test:
  <<: *default
  database: idiario_test
