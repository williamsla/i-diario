development:
  secret_key_base: CHAVE_SECRETA
  SMTP_ADDRESS: SMTP_ADDRESS
  SMTP_PORT: SMTP_PORT
  SMTP_DOMAIN: SMTP_DOMAIN
  SMTP_USER_NAME: SMTP_USER_NAME
  SMTP_PASSWORD: SMTP_PASSWORD
  NO_REPLY_ADDRESS: NO_REPLY_ADDRESS
  EMAIL_SKIP_DOMAINS: EMAIL_SKIP_DOMAINS
  STUDENT_DOMAIN: STUDENT_DOMAIN
  REDIS_URL: REDIS_URL
  REDIS_SENTINELS: REDIS_SENTINELS
  REDIS_MODE: REDIS_MODE (standalone, sentinel)
  REDIS_DB_CACHE: REDIS_DB_CACHE
  REDIS_DB_SESSION: REDIS_DB_SESSION
  REDIS_DB_SIDEKIQ: REDIS_DB_SIDEKIQ
  shortcuts_enabled: true
  # only_one_conceptual_avaliation, show_objectives, conceptual_exam_batch_layout e
  # SEMESTRAL_RECOVERY foram movidos para Configurações gerais (por município / Entity).
  # Educa+ (app separado — ver repositório educamais)
  educamais_url: http://localhost:5173
  educamais_jwt_secret: troque-por-um-segredo-longo-compartilhado-com-o-app-educamais
  # Opcional: liberar o Educa+ só para algumas cidades (name da tabela entities).
  # Se omitido ou vazio, todas as entidades do servidor com URL configurada enxergam o módulo.
  # educamais_entity_names: [municipio_a, municipio_b]
  # Opcional: URL pública do i-diário enviada no JWT ao Educa+ (senão usa a URL do launch)
  # idiario_public_url: https://idiario.seu-municipio.gov.br
  # Chaves antigas (educaindice_*) ainda funcionam até você renomear no secrets.yml

test:
  secret_key_base: CHAVE_SECRETA_TEST
  REDIS_URL: redis://redis:6379/1
