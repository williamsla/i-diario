# Stack de produção com deploy zero-downtime (blue/green).
#
# Arquitetura:
#   nginx (porta pública) → app-blue OU app-green (porta 3000 interna) → redis
#   sidekiq → redis
#
# Deploy: use o script docker/deploy-zero-downtime.sh
#   ./docker/deploy-zero-downtime.sh <nova-tag>
#
# Variáveis esperadas no .env.production (ou no ambiente):
#   TAG (tag atual da imagem)
#   DATABASE_HOST  DATABASE_USERNAME  DATABASE_PASSWORD  DATABASE_NAME
#   Opcional: DATABASE_PORT, DATABASE_POOL, APP_PORT, RAILS_MAX_THREADS, WEB_CONCURRENCY

services:
  nginx:
    image: nginx:alpine
    container_name: idiario-nginx-prod
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-blue
    restart: unless-stopped
    networks:
      - idiario_prod

  redis:
    image: redis:7-alpine
    container_name: idiario-redis-prod
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - idiario_prod

  app-blue:
    image: container-registry.br-ne1.magalu.cloud/idiario/idiario-app:${TAG:?defina TAG}
    container_name: idiario-app-blue
    volumes:
      - ./config/secrets.yml:/app/config/secrets.yml:ro
    environment: &app_env
      RAILS_ENV: production
      NODE_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      RUN_DB_MIGRATE_ON_START: ${RUN_DB_MIGRATE_ON_START:-1}
      DATABASE_HOST: ${DATABASE_HOST:?defina DATABASE_HOST}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?defina DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:?defina DATABASE_NAME}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_POOL: ${DATABASE_POOL:-10}
    healthcheck: &app_health
      test:
        [
          "CMD",
          "ruby",
          "-r",
          "socket",
          "-e",
          "TCPSocket.new('127.0.0.1',3000).close",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 300s
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - idiario_prod

  app-green:
    image: container-registry.br-ne1.magalu.cloud/idiario/idiario-app:${TAG:?defina TAG}
    container_name: idiario-app-green
    volumes:
      - ./config/secrets.yml:/app/config/secrets.yml:ro
    environment:
      <<: *app_env
    healthcheck:
      <<: *app_health
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - idiario_prod
    profiles:
      - green

  sidekiq:
    image: container-registry.br-ne1.magalu.cloud/idiario/idiario-app:${TAG:?defina TAG}
    container_name: idiario-sidekiq-prod
    command:
      ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml", "-e", "production"]
    volumes:
      - ./config/secrets.yml:/app/config/secrets.yml:ro
    environment:
      <<: *app_env
      RUN_DB_MIGRATE_ON_START: "0"
    depends_on:
      redis:
        condition: service_started
      app-blue:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - idiario_prod

volumes:
  redis_data_prod:

networks:
  idiario_prod:
    driver: bridge
